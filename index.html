<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synth Studio</title>
<script src="skins.js"></script>
<style>
:root{ --bg:#d9d6cf; --ink:#1d1f23; --muted:#5d6168; --accent:#ff6a2b; --onink:#fff; --btn:#f6f7f8; --line:#a9aeb5; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#101114; --ink:#e8e8e8; --muted:#9a9a9a; --btn:#2a2c31; --line:#44474e; } }
:root[data-theme="dark"]{ --bg:#101114; --ink:#e8e8e8; --muted:#9a9a9a; --btn:#2a2c31; --line:#44474e; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
nav.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
nav.tabs a{padding:8px 16px;border-radius:10px 10px 0 0;background:rgba(127,127,127,.25);color:inherit;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:.06em}
nav.tabs a.cur{background:var(--accent);color:var(--onink)}
button,select{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:7px;padding:4px 6px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar .hint{font-size:12px;color:var(--muted)}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;margin-bottom:10px;border-radius:12px;background:rgba(127,127,127,.16)}
.strip b{font-size:12px;letter-spacing:.1em}
.strip label{display:flex;align-items:center;gap:5px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:#999}
.dot.on{background:#2fa84f;box-shadow:0 0 8px #2fa84f}
.dot.wait{background:#e0a020}
#room{width:110px}
#syncBpm{width:64px}
#syncGo{background:var(--accent);color:var(--onink);border-color:var(--accent);font-weight:700;padding:6px 14px}
#syncGo.on{background:#2fa84f;border-color:#2fa84f}
#syncMsg,#netMsg{font-size:12px;color:var(--muted)}
.inc{display:flex;gap:4px;align-items:center;font-size:12px}
.inc span{font-weight:700;margin-right:2px}
.beat{width:12px;height:12px;border-radius:50%;background:rgba(127,127,127,.35)}
.beat.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.stage{display:grid;gap:14px;align-items:start}
.stage.overview{grid-template-columns:repeat(3,minmax(0,1fr))}
.stage.focus{grid-template-columns:minmax(0,3.2fr) minmax(0,1fr)}
.stage.focus .panel.big{grid-column:1;grid-row:1 / span 5}
.stage.focus .panel:not(.big){grid-column:2}
.panel{border-radius:14px;background:rgba(127,127,127,.14);padding:8px;view-transition-name:var(--vt);min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px;cursor:pointer;user-select:none}
.ph b{font-size:13px;letter-spacing:.08em}
.ph em{font-style:normal;font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:var(--accent);color:var(--onink);margin-left:6px}
.ph button{padding:3px 9px;font-size:13px}
.ph .hb{display:flex;gap:4px}
.ph .pp{min-width:34px;font-weight:700}
.ph .pp.on{background:#2fa84f;border-color:#2fa84f;color:#fff}
.ph .rm{opacity:.7}
.addtile{order:999;border:2px dashed rgba(127,127,127,.45);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;min-height:140px;color:var(--muted)}
.addtile div{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.addtile button{font-weight:700}
.stage.focus .addtile{grid-column:2}
.frame{position:relative;overflow:hidden;border-radius:10px}
.frame iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:transparent}
.shield{position:absolute;inset:0;display:none;cursor:zoom-in;background:rgba(0,0,0,0);transition:background .15s}
.shield:hover{background:rgba(255,255,255,.08)}
.stage.focus .panel:not(.big) .shield{display:block}
@media (max-width:900px){
  .stage.overview,.stage.focus{grid-template-columns:1fr}
  .stage.focus .panel.big,.stage.focus .panel:not(.big){grid-column:1;grid-row:auto}
}
</style>
</head>
<body>
<nav class="tabs"><a href="index.html" class="cur">Studio</a><a href="fm1.html">FM-1</a><a href="tb303.html">TB-303 / TD-3</a><a href="tr909.html">TR-909</a></nav>
<div class="strip">
  <span class="pill"><i class="dot" id="netDot"></i><span id="netState">Connecting…</span></span>
  <label>Room <input type="text" id="room" maxlength="40"></label><button id="join">Join</button>
  <button id="invite">🔗 Copy invite link</button>
  <span id="netMsg"></span>
</div>
<div class="strip">
  <b>SYNC</b>
  <button id="syncGo">▶ Start all</button>
  <label>Tempo <input type="number" id="syncBpm" min="40" max="300" value="126"> BPM</label>
  <button id="tapBtn" title="Tap at least twice in time">Tap</button>
  <span style="display:flex;gap:4px"><i class="beat"></i><i class="beat"></i><i class="beat"></i><i class="beat"></i></span>
  <span id="syncMsg">Start all launches every machine on the same downbeat; ▶ on a machine starts just that one.</span>
</div>
<div class="bar">
  <button id="overview">▦ Overview</button>
  <span class="hint">Click a machine's title (or a thumbnail) to enlarge it. The computer keyboard plays the machine you clicked last.</span>
</div>
<div class="stage overview" id="stage">
  <div class="addtile" id="addTile"><span>Add a machine</span><div><button data-add="fm1">+ FM-1</button><button data-add="tb303">+ TB-303</button><button data-add="tr909">+ TR-909</button></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const TYPES={fm1:['FM-1','fm1.html'],tb303:['TB-303 / TD-3','tb303.html'],tr909:['TR-909','tr909.html']};
const DEFAULT_MACHINES=['fm1-a','tb303-a','tr909-a'];
const DW=1220, stage=$('#stage');
let panels=[], focused=null;
const api=id=>{try{return panels.find(p=>p.dataset.id===id).querySelector('iframe').contentWindow.syncAPI;}catch(_){return null;}};
const loaded=id=>{const p=panels.find(p=>p.dataset.id===id);return !!(p&&p.dataset.loaded&&api(id));};

// ---------- Panels: each machine renders at full design width in an iframe, scaled to its panel
function contentHeight(f){try{const b=f.contentDocument.body;const cs=getComputedStyle(b);
  return Math.ceil(b.getBoundingClientRect().height+parseFloat(cs.marginTop)+parseFloat(cs.marginBottom));}catch(_){return 900;}}
function fit(){for(const p of panels){const fr=p.querySelector('.frame'),f=fr.querySelector('iframe');
  const s=Math.min(1,fr.clientWidth/DW),h=Math.max(300,contentHeight(f));
  f.style.width=DW+'px';f.style.height=h+'px';f.style.transform='scale('+s+')';fr.style.height=Math.ceil(h*s)+'px';}}
function setLayout(id){
  if(id&&!panels.some(p=>p.dataset.id===id))id=null;
  const run=()=>{focused=id;stage.classList.toggle('overview',!id);stage.classList.toggle('focus',!!id);
    panels.forEach(p=>{p.classList.toggle('big',p.dataset.id===id);p.querySelector('.zoom').textContent=p.dataset.id===id?'⤡':'⤢';});
    // reorder with CSS only: moving an iframe in the DOM would reload it and stop the machine
    const order=transport.machines;panels.forEach(p=>p.style.order=p.dataset.id===id?-1:order.indexOf(p.dataset.id));
    fit();};
  document.startViewTransition?document.startViewTransition(run):run();
}
function addPanel(id){
  const [type,slot]=id.split('-'),[name,src]=TYPES[type];
  const p=document.createElement('div');p.className='panel';p.dataset.id=id;p.style.setProperty('--vt','p-'+id);
  p.innerHTML=`<div class="ph"><b>${name}<em>${slot.toUpperCase()}</em></b><span class="hb">
    <button class="pp" title="Play / stop this machine">▶</button><button class="zoom" title="Enlarge">⤢</button><button class="rm" title="Remove this machine">×</button></span></div>
    <div class="frame"><iframe src="${src}?slot=${slot}" title="${name} ${slot.toUpperCase()}"></iframe><div class="shield"></div></div>`;
  stage.insertBefore(p,$('#addTile'));panels.push(p);
  p.querySelector('.ph').addEventListener('click',()=>setLayout(focused===id?null:id));
  p.querySelector('.shield').addEventListener('click',()=>setLayout(id));
  p.querySelector('.pp').addEventListener('click',e=>{e.stopPropagation();toggleMachine(id);});
  p.querySelector('.rm').addEventListener('click',e=>{e.stopPropagation();share({machines:transport.machines.filter(m=>m!==id)});});
  p.querySelector('.zoom').addEventListener('click',e=>{e.stopPropagation();setLayout(focused===id?null:id);});
  const f=p.querySelector('iframe');
  return new Promise(res=>f.addEventListener('load',()=>{p.dataset.loaded=1;fit();
    try{new f.contentWindow.ResizeObserver(fit).observe(f.contentDocument.body);}catch(_){}
    onPanelLoaded(id);res();},{once:true}));
}
function removePanel(id){const p=panels.find(p=>p.dataset.id===id);if(!p)return;
  const a=api(id);if(a&&a.playing)a.stop();
  panels=panels.filter(x=>x!==p);p.remove();delete lastFlat[id];
  if(focused===id)setLayout(null);fit();}
function syncPanels(){
  for(const p of [...panels])if(!transport.machines.includes(p.dataset.id))removePanel(p.dataset.id);
  const adds=transport.machines.filter(id=>TYPES[id.split('-')[0]]&&!panels.some(p=>p.dataset.id===id)).map(addPanel);
  setLayout(focused);
  try{localStorage.setItem('studioMachines',JSON.stringify(transport.machines));}catch(_){}
  return Promise.all(adds);
}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
  const type=b.dataset.add,used=transport.machines.filter(m=>m.startsWith(type+'-')).map(m=>m.split('-')[1]);
  const slot='abcdefghij'.split('').find(s=>!used.includes(s));if(!slot)return;
  const id=type+'-'+slot;share({machines:[...transport.machines,id],inc:{[id]:false}});});
$('#overview').onclick=()=>setLayout(null);
window.addEventListener('resize',fit);

// ---------- Network: one room per URL (?room=), optional external server (?server=wss://host/ws)
const params=new URLSearchParams(location.search);
const room=(params.get('room')||'main').slice(0,40);
const wsBase=params.get('server')||((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
let ws=null,online=false,everOnline=false,offset=0,bestRtt=1e9,clockReady=false,pendingTransport=null;
const localNow=()=>performance.timeOrigin+performance.now();
const serverNow=()=>localNow()+offset;
$('#room').value=room;
$('#join').onclick=()=>{const r=$('#room').value.trim()||'main';params.set('room',r);location.search=params.toString();};
$('#invite').onclick=async()=>{const u=new URL(location.href);u.searchParams.set('room',room);
  try{await navigator.clipboard.writeText(u.toString());$('#netMsg').textContent='Link copied: '+u;}catch(_){$('#netMsg').textContent=u.toString();}};
function setNet(state,text){$('#netDot').className='dot'+(state==='on'?' on':state==='wait'?' wait':'');$('#netState').textContent=text;}
const wsend=m=>{if(online)ws.send(JSON.stringify(m));};

function connect(){
  if(location.protocol==='file:'){setNet('off','Solo (open through the server to play together)');return;}
  setNet('wait','Connecting…');
  try{ws=new WebSocket(wsBase+(wsBase.includes('?')?'&':'?')+'room='+encodeURIComponent(room));}catch(_){setNet('off','Solo (no server)');return;}
  ws.onopen=()=>{online=true;everOnline=true;bestRtt=1e9;
    for(let i=0;i<6;i++)setTimeout(()=>wsend({t:'ping',c:localNow()}),i*120);};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}handle(m);};
  ws.onclose=()=>{online=false;
    if(everOnline){setNet('wait','Reconnecting…');setTimeout(connect,2500);}
    else setNet('off','Solo (no multiplayer server here)');};
}
function handle(m){
  if(m.t==='pong'){const now=localNow(),rtt=now-m.c;
    if(rtt<bestRtt){bestRtt=rtt;offset=m.s-(m.c+rtt/2);}
    if(!clockReady){clockReady=true;if(pendingTransport){applyTransport(pendingTransport);pendingTransport=null;}}}
  else if(m.t==='welcome'){
    setPeers(m.peers);
    for(const p of panels){const id=p.dataset.id,s=m.state[id];if(!loaded(id))continue;
      if(s&&Object.keys(s).length)applyRemote(id,s);else sendFull(id);}
    if(m.transport){if(clockReady)applyTransport(m.transport);else pendingTransport=m.transport;}
    else wsend({t:'transport',transport});}
  else if(m.t==='peers')setPeers(m.n);
  else if(m.t==='set')applyRemote(m.inst,m.changes);
  else if(m.t==='state'){if(m.state&&Object.keys(m.state).length)applyRemote(m.inst,m.state);else sendFull(m.inst);}
  else if(m.t==='note'){const a=api(m.inst);if(a&&a.remoteNote)a.remoteNote(m.msg);}
  else if(m.t==='transport')applyTransport(m.transport);
}
function setPeers(n){setNet('on',`Online · room “${room}” · ${n} player${n>1?'s':''}`);}

// ---------- Shared machine state: poll each machine, send only the knobs/steps that changed
const flatten=(o,p='',out={})=>{for(const k in o){const v=o[k],key=p?p+'.'+k:k;if(v&&typeof v==='object')flatten(v,key,out);else out[key]=v;}return out;};
function unflatten(f){const root={};
  for(const path in f){const ks=path.split('.');let o=root;
    for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};o=o[ks[i]];}
    o[ks[ks.length-1]]=f[path];}
  return root;}
const lastFlat={};
function pollInst(id){if(!loaded(id))return;const a=api(id);if(!a.getState)return;const f=flatten(a.getState()),prev=lastFlat[id];lastFlat[id]=f;
  if(!prev||!online)return;const ch={};let n=0;for(const k in f)if(f[k]!==prev[k]){ch[k]=f[k];n++;}
  if(n)wsend({t:'set',inst:id,changes:ch});}
function sendFull(id){if(!loaded(id))return;lastFlat[id]=flatten(api(id).getState());wsend({t:'set',inst:id,changes:lastFlat[id]});}
function applyRemote(id,changes){if(!loaded(id))return;const a=api(id);
  pollInst(id); // flush our own pending edits first so they aren't lost
  a.setState(unflatten({...(lastFlat[id]||flatten(a.getState())),...changes}));
  lastFlat[id]=flatten(a.getState());}
setInterval(()=>{if(online)for(const p of panels)pollInst(p.dataset.id);},80);
window.studioHub={note(inst,msg){wsend({t:'note',inst,msg});},toggle(){go.click();}};

// ---------- Shared transport: {playing, bpm, startAt (server ms, a bar boundary), inc (machines playing), run, machines}
let savedMachines=null;try{savedMachines=JSON.parse(localStorage.getItem('studioMachines')||'null');}catch(_){}
let transport={playing:false,bpm:126,startAt:0,inc:{},run:0,machines:Array.isArray(savedMachines)&&savedMachines.length?savedMachines:DEFAULT_MACHINES};
let running=false,t0=0,beatTimer=null,appliedRun=-1;
const bpmEl=$('#syncBpm'),go=$('#syncGo'),msg=$('#syncMsg');
const isOn=id=>transport.inc[id]!==false;
function nextBar(){const bar=240000/transport.bpm;let at=t0;const min=localNow()+200;if(at<min)at+=Math.ceil((min-at)/bar)*bar;return at;}
function updateHeads(){for(const p of panels){const b=p.querySelector('.pp'),on=running&&isOn(p.dataset.id);
  b.textContent=on?'■':'▶';b.classList.toggle('on',on);}}
async function applyTransport(tr){
  transport={...transport,...tr,inc:{...transport.inc,...(tr.inc||{})}};
  bpmEl.value=transport.bpm;
  await syncPanels();
  for(const p of panels){const a=api(p.dataset.id);if(a)a.setTempo(transport.bpm);}
  if(!transport.playing){if(running)stopLocal();updateHeads();return;}
  t0=transport.startAt-offset;
  const fresh=!running||appliedRun!==transport.run;appliedRun=transport.run;
  const at=nextBar(),res=[];
  for(const p of panels){const id=p.dataset.id;if(!loaded(id))continue;const a=api(id);
    if(!isOn(id)){if(a.playing)a.stop();}
    else if(fresh||!a.playing)res.push(a.start(at).then(s=>[id,s]));}
  running=true;go.textContent='■ Stop all';go.classList.add('on');updateHeads();
  clearInterval(beatTimer);beatTimer=setInterval(showBeat,30);
  const blocked=(await Promise.all(res)).filter(r=>r[1]!=='running').map(r=>r[0].toUpperCase());
  msg.textContent=blocked.length?('Sound blocked by the browser for '+blocked.join(', ')+': click once anywhere on the page, then press Start again.'):'Synced at '+transport.bpm+' BPM.';
}
function onPanelLoaded(id){const a=api(id);if(!a)return;
  a.setTempo(transport.bpm);lastFlat[id]=flatten(a.getState());
  if(online)wsend({t:'get',inst:id});
  if(running&&isOn(id))a.start(nextBar());
  updateHeads();}
function stopLocal(){for(const p of panels){const a=api(p.dataset.id);if(a&&a.playing)a.stop();}
  running=false;go.textContent='▶ Start all';go.classList.remove('on');clearInterval(beatTimer);updateHeads();
  document.querySelectorAll('.beat').forEach(b=>b.classList.remove('on'));msg.textContent='Stopped.';}
function share(tr){applyTransport(tr);wsend({t:'transport',transport});}
const allOn=()=>Object.fromEntries(transport.machines.map(m=>[m,true]));
go.onclick=()=>share(running?{playing:false}:{playing:true,startAt:serverNow()+250,run:Math.random(),inc:allOn()});
function toggleMachine(id){
  if(running&&isOn(id)){const inc={...transport.inc,[id]:false};
    share(transport.machines.some(m=>inc[m]!==false)?{inc}:{inc,playing:false});}
  else if(running)share({inc:{[id]:true}});
  else share({playing:true,startAt:serverNow()+250,run:Math.random(),inc:Object.fromEntries(transport.machines.map(m=>[m,m===id]))});
}
function setBpm(v){if(!(v>=40&&v<=300))return;
  // keep the bar grid continuous across the tempo change so late joiners land on the downbeat
  let startAt=transport.startAt;if(running){const T=serverNow(),beats=(T-startAt)*transport.bpm/60000;startAt=T-beats*60000/v;}
  share({bpm:v,startAt});}
bpmEl.addEventListener('input',()=>setBpm(+bpmEl.value));
function showBeat(){const el=(localNow()-t0)/1000;const b=el<0?-1:Math.floor(el*transport.bpm/60)%4;
  document.querySelectorAll('.beat').forEach((x,i)=>x.classList.toggle('on',i===b));}
let taps=[];
$('#tapBtn').onclick=()=>{const n=performance.now();taps=taps.filter(t=>n-t<2500);taps.push(n);
  if(taps.length>=2){const d=(taps[taps.length-1]-taps[0])/(taps.length-1);setBpm(Math.round(60000/d));}};
window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();go.click();}});

syncPanels().then(connect);
</script>
</body>
</html>
